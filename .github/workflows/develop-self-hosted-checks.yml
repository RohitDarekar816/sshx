name: Develop Branch Codex Issue Fix

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  codex-issue-fix:
    runs-on: [self-hosted]
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build prompt from oldest issue
        id: build_prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROMPT="$(python3 scripts/build_issue_prompt.py --repo "${GITHUB_REPOSITORY}" --issue-pick oldest --state open)"
          {
            echo 'prompt<<EOF'
            echo "$PROMPT"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Run OpenCode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          opencode run --model opencode/big-pickle "${{ steps.build_prompt.outputs.prompt }}"
